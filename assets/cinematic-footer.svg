<svg width="1000" height="150" viewBox="0 0 1000 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140306" />
      <stop offset="30%" stop-color="#0A0A0E" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="topGlowBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2020" stop-opacity="0" />
      <stop offset="25%" stop-color="#8B0000" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FF2020" stop-opacity="1" />
      <stop offset="75%" stop-color="#8B0000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF2020" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FF4040" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="laserBeamGlow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="0" y="0" width="1000" height="150" rx="14" fill="url(#footerBg)" />
  <rect x="1" y="1" width="998" height="148" rx="13" stroke="#250509" stroke-width="1.5" />

  <!-- Top Laser Beam -->
  <line x1="20" y1="2" x2="980" y2="2" stroke="url(#topGlowBeam)" stroke-width="3" filter="url(#laserBeamGlow)" />
  <line x1="250" y1="2" x2="750" y2="2" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8" />

  <!-- Center Core Diamond -->
  <rect x="494" y="-6" width="12" height="12" rx="2" transform="rotate(45 500 0)" fill="#FF2020" filter="url(#laserBeamGlow)" />
  <rect x="497" y="-3" width="6" height="6" rx="1" transform="rotate(45 500 0)" fill="#FFFFFF" />

  <!-- Tech Lines & Grid Details -->
  <path d="M 60 30 L 140 30 L 160 50 L 320 50" stroke="#FF2020" stroke-width="1" stroke-opacity="0.25" fill="none" />
  <path d="M 940 30 L 860 30 L 840 50 L 680 50" stroke="#FF2020" stroke-width="1" stroke-opacity="0.25" fill="none" />
  <circle cx="60" cy="30" r="2.5" fill="#FF2020" opacity="0.6" />
  <circle cx="940" cy="30" r="2.5" fill="#FF2020" opacity="0.6" />

  <!-- Brand Typography -->
  <text x="500" y="58" fill="url(#textGrad)" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="6" text-anchor="middle">
    ENGINEERING A BETTER TOMORROW
  </text>

  <!-- Motto Monospace -->
  <text x="500" y="90" fill="#E4E4E7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="4" text-anchor="middle">
    BUILD  ·  LEARN  ·  IMPROVE  ·  REPEAT
  </text>

  <!-- Quote -->
  <text x="500" y="118" fill="#8B949E" font-family="'Segoe UI', italic, sans-serif" font-size="12" letter-spacing="1" text-anchor="middle">
    "Turning Ideas Into Real Products"
  </text>
</svg>

