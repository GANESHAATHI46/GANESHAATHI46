<svg width="940" height="130" viewBox="0 0 940 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E14" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A24" />
      <stop offset="100%" stop-color="#0A0A0E" />
    </linearGradient>
    <linearGradient id="finalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D0007" />
      <stop offset="100%" stop-color="#1A0205" />
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="936" height="126" rx="12" fill="url(#pipeBg)" stroke="#220609" stroke-width="1.5" />
  <rect x="6" y="6" width="928" height="118" rx="8" stroke="#FF2020" stroke-opacity="0.1" stroke-width="1" />

  <!-- Laser pipeline backbone -->
  <line x1="45" y1="65" x2="895" y2="65" stroke="#FF2020" stroke-width="2" opacity="0.6" />

  <!-- Step 1: Code -->
  <g transform="translate(18, 30)">
    <rect width="78" height="70" rx="8" fill="url(#stepGrad)" stroke="#3A080D" stroke-width="1" />
    <circle cx="39" cy="20" r="10" fill="#200408" stroke="#FF2020" stroke-width="1" />
    <text x="39" y="24" fill="#FF2020" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">01</text>
    <text x="39" y="46" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Source</text>
    <text x="39" y="58" fill="#8B949E" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Code</text>
  </g>

  <!-- Step 2: Git -->
  <g transform="translate(108, 30)">
    <rect width="78" height="70" rx="8" fill="url(#stepGrad)" stroke="#3A080D" stroke-width="1" />
    <circle cx="39" cy="20" r="10" fill="#200408" stroke="#FF2020" stroke-width="1" />
    <text x="39" y="24" fill="#FF2020" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">02</text>
    <text x="39" y="46" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Git /</text>
    <text x="39" y="58" fill="#8B949E" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">GitHub</text>
  </g>

  <!-- Step 3: Test -->
  <g transform="translate(198, 30)">
    <rect width="78" height="70" rx="8" fill="url(#stepGrad)" stroke="#3A080D" stroke-width="1" />
    <circle cx="39" cy="20" r="10" fill="#200408" stroke="#FF2020" stroke-width="1" />
    <text x="39" y="24" fill="#FF2020" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">03</text>
    <text x="39" y="46" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Automated</text>
    <text x="39" y="58" fill="#8B949E" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Testing</text>
  </g>

  <!-- Step 4: Docker -->
  <g transform="translate(288, 30)">
    <rect width="78" height="70" rx="8" fill="url(#stepGrad)" stroke="#3A080D" stroke-width="1" />
    <circle cx="39" cy="20" r="10" fill="#200408" stroke="#FF2020" stroke-width="1" />
    <text x="39" y="24" fill="#FF2020" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">04</text>
    <text x="39" y="46" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Docker</text>
    <text x="39" y="58" fill="#8B949E" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Image</text>
  </g>

  <!-- Step 5: CI -->
  <g transform="translate(378, 30)">
    <rect width="78" height="70" rx="8" fill="url(#stepGrad)" stroke="#3A080D" stroke-width="1" />
    <circle cx="39" cy="20" r="10" fill="#200408" stroke="#FF2020" stroke-width="1" />
    <text x="39" y="24" fill="#FF2020" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">05</text>
    <text x="39" y="46" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">CI</text>
    <text x="39" y="58" fill="#8B949E" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Pipeline</text>
  </g>

  <!-- Step 6: Security -->
  <g transform="translate(468, 30)">
    <rect width="78" height="70" rx="8" fill="url(#stepGrad)" stroke="#3A080D" stroke-width="1" />
    <circle cx="39" cy="20" r="10" fill="#200408" stroke="#FF2020" stroke-width="1" />
    <text x="39" y="24" fill="#FF2020" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">06</text>
    <text x="39" y="46" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Security</text>
    <text x="39" y="58" fill="#8B949E" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Checks</text>
  </g>

  <!-- Step 7: Deploy -->
  <g transform="translate(558, 30)">
    <rect width="78" height="70" rx="8" fill="url(#stepGrad)" stroke="#3A080D" stroke-width="1" />
    <circle cx="39" cy="20" r="10" fill="#200408" stroke="#FF2020" stroke-width="1" />
    <text x="39" y="24" fill="#FF2020" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">07</text>
    <text x="39" y="46" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Deploy-</text>
    <text x="39" y="58" fill="#8B949E" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">ment</text>
  </g>

  <!-- Step 8: Cloud Infra -->
  <g transform="translate(648, 30)">
    <rect width="78" height="70" rx="8" fill="url(#stepGrad)" stroke="#3A080D" stroke-width="1" />
    <circle cx="39" cy="20" r="10" fill="#200408" stroke="#FF2020" stroke-width="1" />
    <text x="39" y="24" fill="#FF2020" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">08</text>
    <text x="39" y="46" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Cloud</text>
    <text x="39" y="58" fill="#8B949E" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Infra</text>
  </g>

  <!-- Step 9: Monitor -->
  <g transform="translate(738, 30)">
    <rect width="78" height="70" rx="8" fill="url(#stepGrad)" stroke="#3A080D" stroke-width="1" />
    <circle cx="39" cy="20" r="10" fill="#200408" stroke="#FF2020" stroke-width="1" />
    <text x="39" y="24" fill="#FF2020" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">09</text>
    <text x="39" y="46" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Monitor-</text>
    <text x="39" y="58" fill="#8B949E" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">ing</text>
  </g>

  <!-- Step 10: Production -->
  <g transform="translate(828, 30)">
    <rect width="90" height="70" rx="8" fill="url(#finalGrad)" stroke="#FF2020" stroke-width="1.5" filter="url(#pGlow)" />
    <circle cx="45" cy="20" r="10" fill="#FF2020" />
    <text x="45" y="24" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">10</text>
    <text x="45" y="46" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Production</text>
    <text x="45" y="58" fill="#FF8080" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Live 🚀</text>
  </g>
</svg>

